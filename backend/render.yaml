services:
  - type: web
    name: socialsync-backend
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx prisma db push && npm run db:seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MOCK_MODE
        value: true
      - key: USE_REDIS
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://your-frontend-domain.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: socialsync-db
          property: connectionString

databases:
  - name: socialsync-db
    databaseName: socialsync
    user: socialsync_user
    plan: free
